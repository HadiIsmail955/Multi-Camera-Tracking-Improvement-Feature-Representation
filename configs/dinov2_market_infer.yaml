model:
  backbone: dinov2
  feature_mode: cls_patchavg
  lora_rank: 16
  use_lora: false   # set to false for full fine-tuning
  osnet_weights: null

checkpoint:
  path: checkpoints_arcface/best_model.pth
  use_pretrained: false

data:
  query: data_csv/query_records.csv
  gallery: data_csv/gallery_records.csv
  num_workers: 4

eval:
  batch_size: 64

rerank:
  enabled: true
  k1: 20
  k2: 6
  lambda: 0.3

output:
  distance_matrix: distance_matrix.pt
  matching_results: matching_results.csv
