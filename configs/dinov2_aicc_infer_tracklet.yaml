model:
  backbone: dinov2
  lora_rank: 16
  use_lora: false
  osnet_weights: null

checkpoint:
  path: checkpoints/best_model.pth
  use_pretrained: false

data:
  query: /pfs/work9/workspace/scratch/st_st201745-reid_project/manifests/image_query_small.csv
  gallery: /pfs/work9/workspace/scratch/st_st201745-reid_project/manifests/image_gallery_small.csv
  num_workers: 4
  # Pool per-image embeddings into one descriptor per tracklet.
  # Options: "mean" | "max" | null (image-level, no pooling)
  tracklet_pool: dbscan

eval:
  batch_size: 64

rerank:
  enabled: false
  k1: 20
  k2: 6
  lambda: 0.3

output:
  distance_matrix: distance_matrix.pt
  matching_results: matching_results.csv
