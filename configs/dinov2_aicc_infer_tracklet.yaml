model:
  backbone: dinov2
  lora_rank: 16
  use_lora: false
  osnet_weights: null
  feature_mode: cls

checkpoint:
  path: /mnt/nfs/home/st201745/checkpoints/best_model.pth
  use_pretrained: true

data:
  query: /mnt/nfs/home/st201745/aicity_preprocessed/manifests/image_query.csv
  gallery: /mnt/nfs/home/st201745/aicity_preprocessed/manifests/image_gallery.csv
  num_workers: 4
  # Pool per-image embeddings into one descriptor per tracklet.
  # Options: "mean" | "max" | null (image-level, no pooling)
  # "mean" | "max" |"dbscan"| "weighted" |"medoid" |"gem"
  tracklet_pool: dbscan

eval:
  batch_size: 64

rerank:
  enabled: false
  k1: 20
  k2: 6
  lambda: 0.3

output:
  distance_matrix: /mnt/nfs/home/st201745/checkpoints/distance_matrix.pt
  matching_results: /mnt/nfs/home/st201745/checkpoints/matching_results.csv
