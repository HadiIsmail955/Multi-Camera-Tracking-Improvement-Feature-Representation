  # Options: "mean" | "max" | null (image-level, no pooling)     valid_pools = (
  # "mean" | "max" |"dbscan"| "weighted" |"medoid" |"consensus" |"gem"
  tracklet_pool: dbscan

eval:
  batch_size: 64

rerank:
  enabled: false
  k1: 20
  k2: 6
  lambda: 0.3

output:
  distance_matrix: /mnt/nfs/home/st201745/checkpoints/distance_matrix.pt
  matching_results: /mnt/nfs/home/st201745/checkpoints/matching_results.csv
