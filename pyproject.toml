[project]
name = "reid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
	"torch>=2.11",
	"torchvision",
	"torchaudio>=2.11",
	"torchreid",
	"gdown",
	"tensorboard",
	"timm",
	"peft",
	"transformers>=4.48.0",
	"tokenizers>=0.20.0",
	"pytorch-metric-learning",
	"faiss-cpu",
	"scikit-learn",
	"opencv-python",
	"kornia",
	"av>=17.0.1",
	"pandas>=3.0.3",
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reid"]

[project.scripts]
reid = "reid.main:main"



[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
